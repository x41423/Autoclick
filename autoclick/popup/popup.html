<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MouseClick Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <h2>🐭 脚本列表</h2>
    <div id="script-list"></div>

    <!-- 编辑区域 -->
    <div id="editor" style="display:none; margin-top:12px; border-top:1px solid #ccc; padding-top:8px;">
      <h3 id="edit-script-name"></h3>
      <div id="action-list" style="max-height:200px; overflow-y:auto; border:1px solid #eee; padding:4px; margin-bottom:6px;"></div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button id="add-delay">⏱️ 添加延迟</button>
        <button id="add-click">🎯 添加点击</button>
        <button id="save-editor" style="background:#1a73e8;color:white;">💾 保存</button>
        <button id="cancel-editor">❌ 取消</button>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
        <label style="font-size:13px; cursor:pointer;">
        <input type="checkbox" id="continuous-mode"> 🔁 连续拾取模式
        </label>
        <span style="font-size:11px; color:#888;">(空格键暂停/继续)</span>
    </div>

    <div style="margin-top: 12px;">
      <button id="btn-new">➕ 新建脚本</button>
      <button id="btn-import">📥 导入</button>
      <button id="btn-export">📤 导出</button>
      <button id="btn-logs">📋 查看日志</button>
      <button id="btn-clear-logs">🗑️ 清空日志</button>
    </div>
    <div style="margin-top: 8px; font-size: 12px; color: #666;">
      快捷键: Ctrl+B 启动默认 | Ctrl+Shift+X 停止
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
